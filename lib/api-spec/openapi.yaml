openapi: 3.1.0
info:
  title: AIRSI AlgoTrader API
  version: 0.1.0
  description: AIRSI AlgoTrader Dashboard API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: bot
    description: Trading bot operations
  - name: experiments
    description: Human-reviewed self-improvement research operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /bot/ping:
    get:
      operationId: botPing
      tags: [bot]
      summary: Is the bot online?
      responses:
        "200":
          description: Ping result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotPing"

  /bot/status:
    get:
      operationId: botStatus
      tags: [bot]
      summary: Open trades and bot state
      responses:
        "200":
          description: Bot status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotStatus"

  /bot/profit:
    get:
      operationId: botProfit
      tags: [bot]
      summary: Overall profit/loss summary
      responses:
        "200":
          description: Profit summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotProfit"

  /bot/performance:
    get:
      operationId: botPerformance
      tags: [bot]
      summary: Per-pair performance breakdown
      responses:
        "200":
          description: Per-pair performance
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PairPerformance"

  /bot/trades:
    get:
      operationId: botTrades
      tags: [bot]
      summary: Recent closed trades
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Trade list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradeList"

  /bot/balance:
    get:
      operationId: botBalance
      tags: [bot]
      summary: Wallet balances
      responses:
        "200":
          description: Balance info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotBalance"

  /bot/logs:
    get:
      operationId: botLogs
      tags: [bot]
      summary: Recent log lines
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
      responses:
        "200":
          description: Log lines
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotLogs"

  /bot/config:
    get:
      operationId: botConfig
      tags: [bot]
      summary: Active bot configuration
      responses:
        "200":
          description: Bot config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotConfig"
  /bot/intelligence:
    get:
      operationId: botIntelligence
      tags: [bot]
      summary: Latest market-intelligence risk decision
      responses:
        "200":
          description: Read-only intelligence snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketIntelligence"

  /experiments:
    get:
      operationId: listExperiments
      tags: [experiments]
      summary: List human-review experiment proposals
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 200
      responses:
        "200":
          description: Experiment history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExperimentList"
        "400":
          description: Invalid limit

  /experiments/{id}:
    get:
      operationId: getExperiment
      tags: [experiments]
      summary: Get one experiment proposal and evaluation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Experiment detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExperimentSummary"
        "404":
          description: Experiment not found

  /experiments/{id}/decision:
    post:
      operationId: decideExperiment
      tags: [experiments]
      summary: Record a human decision for an evaluated proposal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExperimentDecisionInput"
      responses:
        "201":
          description: Decision recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExperimentSummary"
        "400":
          description: Invalid decision
        "404":
          description: Experiment not found
        "409":
          description: Proposal has not been evaluated
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    BotPing:
      type: object
      properties:
        online:
          type: boolean
        status:
          type: ["string", "null"]
      required: [online]

    BotStatus:
      type: object
      properties:
        online:
          type: boolean
        mode:
          type: ["string", "null"]
        trades:
          type: array
          items:
            $ref: "#/components/schemas/OpenTrade"
      required: [online]

    OpenTrade:
      type: object
      properties:
        trade_id:
          type: integer
        pair:
          type: string
        open_rate:
          type: number
        current_rate:
          type: number
        profit_pct:
          type: number
        profit_abs:
          type: number
        open_date:
          type: string
        stake_amount:
          type: number
        amount:
          type: number
        stop_loss_pct:
          type: ["number", "null"]
        stoploss_current_dist_pct:
          type: ["number", "null"]
      required:
        [
          trade_id,
          pair,
          open_rate,
          current_rate,
          profit_pct,
          profit_abs,
          open_date,
        ]

    BotProfit:
      type: object
      properties:
        profit_all_coin:
          type: ["number", "null"]
        profit_all_percent:
          type: ["number", "null"]
        profit_closed_coin:
          type: ["number", "null"]
        profit_closed_percent:
          type: ["number", "null"]
        winning_trades:
          type: ["integer", "null"]
        losing_trades:
          type: ["integer", "null"]
        trade_count:
          type: ["integer", "null"]
        first_trade_date:
          type: ["string", "null"]
        latest_trade_date:
          type: ["string", "null"]
        avg_duration:
          type: ["string", "null"]
        best_pair:
          type: ["string", "null"]
        worst_pair:
          type: ["string", "null"]
        stake_currency:
          type: ["string", "null"]
      required: []

    PairPerformance:
      type: object
      properties:
        pair:
          type: string
        profit:
          type: number
        profit_pct:
          type: number
        count:
          type: integer
      required: [pair, profit, profit_pct, count]

    ClosedTrade:
      type: object
      properties:
        trade_id:
          type: integer
        pair:
          type: string
        open_rate:
          type: number
        close_rate:
          type: ["number", "null"]
        profit_pct:
          type: ["number", "null"]
        profit_abs:
          type: ["number", "null"]
        open_date:
          type: string
        close_date:
          type: ["string", "null"]
        sell_reason:
          type: ["string", "null"]
        stake_amount:
          type: number
      required: [trade_id, pair, open_rate, open_date, stake_amount]

    TradeList:
      type: object
      properties:
        trades:
          type: array
          items:
            $ref: "#/components/schemas/ClosedTrade"
        trades_count:
          type: integer
        total_trades:
          type: integer
      required: []

    BalanceCurrency:
      type: object
      properties:
        currency:
          type: string
        free:
          type: number
        balance:
          type: number
        used:
          type: number
        est_stake:
          type: number
        stake:
          type: string
      required: [currency, free, balance, used]

    BotBalance:
      type: object
      properties:
        currencies:
          type: array
          items:
            $ref: "#/components/schemas/BalanceCurrency"
        total:
          type: ["number", "null"]
        stake:
          type: ["string", "null"]
        note:
          type: ["string", "null"]
      required: []

    LogLine:
      type: object
      properties:
        timestamp:
          type: number
        level:
          type: integer
        message:
          type: string
        funcname:
          type: string
        lineno:
          type: integer
      required: [timestamp, level, message]

    BotLogs:
      type: object
      properties:
        logs:
          type: array
          items:
            $ref: "#/components/schemas/LogLine"
        log_count:
          type: integer
      required: []

    MarketIntelligence:
      type: object
      properties:
        available:
          type: boolean
        decision:
          oneOf:
            - type: object
              properties:
                generated_at: { type: string }
                expires_at: { type: string }
                allow_long_entries: { type: boolean }
                risk_level:
                  type: string
                  enum: [normal, guarded, elevated, high]
                confidence: { type: number, minimum: 0, maximum: 1 }
                reason: { type: string }
                source_count: { type: integer }
                news_count: { type: integer }
                model: { type: string }
                snapshot_hash: { type: string }
                errors:
                  type: array
                  items: { type: string }
              required:
                [
                  generated_at,
                  expires_at,
                  allow_long_entries,
                  risk_level,
                  confidence,
                  reason,
                  source_count,
                  news_count,
                  model,
                  snapshot_hash,
                  errors,
                ]
            - type: "null"
      required: [available, decision]

    ExperimentMetrics:
      type: object
      properties:
        expectancy: { type: number }
        max_drawdown: { type: number }
        number_of_trades: { type: number }
      required: [expectancy, max_drawdown, number_of_trades]

    ExperimentProposal:
      type: object
      additionalProperties: true
      properties:
        schema_version: { type: integer }
        proposal_id: { type: string }
        created_at: { type: string }
        title: { type: string }
        hypothesis: { type: string }
        proposal_type: { type: string }
        target_config: { type: string }
        changes:
          type: object
          additionalProperties: { type: number }
        evaluation_plan:
          type: object
          additionalProperties: true
        source_summary:
          type: object
          additionalProperties: true
        rationale: { type: string }
        status: { type: string }
      required: [schema_version, proposal_id, created_at, title, hypothesis, proposal_type, target_config, changes, evaluation_plan, source_summary, rationale, status]

    ExperimentEvaluation:
      type: object
      additionalProperties: true
      properties:
        schema_version: { type: integer }
        proposal_id: { type: string }
        evaluated_at: { type: string }
        evaluator_version: { type: string }
        baseline:
          $ref: "#/components/schemas/ExperimentMetrics"
        candidate:
          $ref: "#/components/schemas/ExperimentMetrics"
        delta:
          $ref: "#/components/schemas/ExperimentMetrics"
        verdict:
          type: string
          enum: [promising, not_promising, inconclusive, not_run]
        notes: { type: string }
      required: [schema_version, proposal_id, evaluated_at, evaluator_version, baseline, candidate, delta, verdict, notes]

    HumanDecision:
      type: object
      additionalProperties: true
      properties:
        schema_version: { type: integer }
        proposal_id: { type: string }
        decided_at: { type: string }
        reviewer: { type: string }
        decision:
          type: string
          enum: [approve, reject, request-more-data]
        rationale: { type: string }
        apply_to_experimental: { type: boolean }
        applied_path: { type: [string, "null"] }
      required: [schema_version, proposal_id, decided_at, reviewer, decision, rationale, apply_to_experimental, applied_path]

    ExperimentSummary:
      type: object
      properties:
        id: { type: string }
        status:
          type: string
          enum: [pending, approved, rejected, request-more-data, evaluated]
        proposal:
          $ref: "#/components/schemas/ExperimentProposal"
        evaluation:
          oneOf:
            - $ref: "#/components/schemas/ExperimentEvaluation"
            - type: "null"
        decision:
          oneOf:
            - $ref: "#/components/schemas/HumanDecision"
            - type: "null"
        experimental_profile: { type: [string, "null"] }
      required: [id, status, proposal, evaluation, decision, experimental_profile]

    ExperimentList:
      type: object
      properties:
        experiments:
          type: array
          items:
            $ref: "#/components/schemas/ExperimentSummary"
        total: { type: integer }
      required: [experiments, total]

    ExperimentDecisionInput:
      type: object
      properties:
        decision:
          type: string
          enum: [approve, reject, request-more-data]
        note: { type: [string, "null"] }
        reviewer: { type: [string, "null"] }
        apply_experimental: { type: boolean, default: false }
      required: [decision]

    BotConfig:
      type: object
      properties:
        strategy:
          type: ["string", "null"]
        state:
          type: ["string", "null"]
        dry_run:
          type: ["boolean", "null"]
        stake_currency:
          type: ["string", "null"]
        stake_amount:
          type: ["number", "null"]
        max_open_trades:
          type: ["integer", "null"]
        timeframe:
          type: ["string", "null"]
        exchange:
          type: ["string", "null"]
      required: []
