version: "3.9"

# ──────────────────────────────────────────────────────────────────────────────
# AIRSI AlgoTrader — Docker Compose
#
# Usage:
#   Paper trading:  docker compose up
#   Live trading:   FREQTRADE_CONFIG_TEMPLATE=./bot/config.live.json docker compose up
#   Stop:           docker compose down
# ──────────────────────────────────────────────────────────────────────────────

services:

  # ── Freqtrade Bot ─────────────────────────────────────────────────
  freqtrade:
    image: freqtradeorg/freqtrade:stable
    container_name: airsi-algotrader-freqtrade
    restart: unless-stopped
    volumes:
      - ./bot:/freqtrade/user_data
      - ${FREQTRADE_CONFIG_TEMPLATE:-./bot/config.paper.json}:/freqtrade/config.template.json:ro
      - ./bot/strategies:/freqtrade/user_data/strategies:ro
      - ./scripts:/freqtrade/project_scripts:ro
      - ./docker/freqtrade-entrypoint.sh:/freqtrade/project_scripts/freqtrade-entrypoint.sh:ro
    ports:
      - "127.0.0.1:8080:8080"    # Freqtrade REST API & UI (localhost only)
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - FREQTRADE_API_USER=${FREQTRADE_API_USER:?Set FREQTRADE_API_USER before starting the stack}
      - FREQTRADE_API_PASS=${FREQTRADE_API_PASS:?Set FREQTRADE_API_PASS before starting the stack}
      - FREQTRADE_JWT_SECRET=${FREQTRADE_JWT_SECRET:?Set FREQTRADE_JWT_SECRET before starting the stack}
      - EXCHANGE_API_KEY=${EXCHANGE_API_KEY:-}
      - EXCHANGE_API_SECRET=${EXCHANGE_API_SECRET:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
    entrypoint: ["/bin/bash", "/freqtrade/project_scripts/freqtrade-entrypoint.sh"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Market intelligence worker ────────────────────────────────────
  intelligence:
    image: freqtradeorg/freqtrade:stable
    container_name: airsi-algotrader-intelligence
    restart: unless-stopped
    volumes:
      - ./bot:/freqtrade/user_data
      - ./bot/market_intelligence.py:/freqtrade/project_scripts/market_intelligence.py:ro
    environment:
      - LLM_API_BASE=${LLM_API_BASE:-https://api.openai.com/v1}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-gpt-5-mini}
      - NEWS_RSS_URLS=${NEWS_RSS_URLS:-}
      - INTELLIGENCE_POLL_SECONDS=${INTELLIGENCE_POLL_SECONDS:-900}
      - INTELLIGENCE_TTL_SECONDS=${INTELLIGENCE_TTL_SECONDS:-1800}
      - INTELLIGENCE_DECISION_PATH=/freqtrade/user_data/market_intelligence.json
    command: ["python3", "/freqtrade/project_scripts/market_intelligence.py", "--interval", "${INTELLIGENCE_POLL_SECONDS:-900}", "--output", "/freqtrade/user_data/market_intelligence.json"]

  # ── Dashboard API (Node.js proxy to Freqtrade) ────────────────────
  dashboard-api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: airsi-algotrader-dashboard-api
    restart: unless-stopped
    volumes:
      - ./bot/user_data:/app/intelligence:ro
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      - PORT=5000
      - FREQTRADE_API_URL=http://freqtrade:8080
      - FREQTRADE_API_USER=${FREQTRADE_API_USER:?Set FREQTRADE_API_USER before starting the stack}
      - FREQTRADE_API_PASS=${FREQTRADE_API_PASS:?Set FREQTRADE_API_PASS before starting the stack}
      - FREQTRADE_JWT_SECRET=${FREQTRADE_JWT_SECRET:?Set FREQTRADE_JWT_SECRET before starting the stack}
      - INTELLIGENCE_DECISION_PATH=/app/intelligence/market_intelligence.json
      - NODE_ENV=production
    depends_on:
      freqtrade:
        condition: service_healthy

  # ── Ollama (optional local AI) ────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: airsi-algotrader-ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    profiles:
      - local-ai     # Only starts with: docker compose --profile local-ai up

volumes:
  ollama_data:
