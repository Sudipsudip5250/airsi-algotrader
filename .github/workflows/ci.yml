name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "22.13"
  PNPM_VERSION: "11.24.0"

jobs:
  python:
    name: Python checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: bot/requirements.txt
      - name: Install Python dependencies
        run: python -m pip install -r bot/requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q bot agents scripts
      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          pip-audit -r bot/requirements.txt --progress-spinner off
      - name: Run unit tests
        run: python -m pytest bot/tests/ agents/tests/ -v

  typescript:
    name: TypeScript checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install pnpm
        run: npm install --global pnpm@${{ env.PNPM_VERSION }}
      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit all Node dependencies
        run: pnpm audit --audit-level high
      - name: Typecheck all workspaces
        run: pnpm run typecheck
      - name: Build dashboard and API
        run: pnpm run build
